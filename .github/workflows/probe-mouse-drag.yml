# Mouse-drag probe: measure whether a held-button drag is reported at all.
#
# WHY: on macOS (2026-09-11) DRAW's own diagnostic showed that while a mouse
# button is held, _MOUSEINPUT returns ZERO events, so _MOUSEX/_MOUSEY stay
# pinned at the press point and every drag-driven tool collapses to one pixel.
# Free (no-button) motion is delivered normally. Linux is unaffected.
#
# WHAT THIS CAN AND CANNOT DO:
#   * linux  — runs the WHOLE experiment automatically. Xvfb gives a real X
#              display and xdotool posts real XTEST press/move/release events,
#              so the numbers are genuine. This is the CONTROL: it proves the
#              rig measures a drag correctly where dragging is known to work.
#   * macos  — builds an arm64 binary and uploads it, but does NOT measure the
#              drag. GH Mac runners cannot create a GLFW window in this context
#              (see hw-cursor-crossplatform.yml, which learned this the
#              expensive way), and synthetic CGEvents would need accessibility/
#              TCC grants a runner does not have. The run step is attempted
#              anyway, bounded, purely to record whether a window opens at all.
#              Get real macOS numbers by running the uploaded binary on a real
#              display.
#
# The probe itself is DEV/probe-mouse-drag.bas — standalone, no DRAW sources.
# It scores each drag: samples / events / distinct / path / spread and a
# TRACKS / PARTIAL / FROZEN verdict, in probe-mouse-drag.log.
name: Mouse Drag Probe

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Which OS(es) to run'
        type: choice
        default: all
        options: [all, linux, macos]
  # TEMPORARY: self-trigger on the investigation branch so the experiment can be
  # run before this is merged (workflow_dispatch only works from the default
  # branch). Remove this push trigger before merge.
  push:
    branches: [claude/brave-bohr-dy3op1]
    paths:
      - 'DEV/probe-mouse-drag.bas'
      - '.github/workflows/probe-mouse-drag.yml'

env:
  # QB64-PE main: a740g's GLFW work (formerly PR #701) is merged, so main is the
  # toolchain DRAW actually builds against now.
  QB64PE_REPO: https://github.com/QB64-Phoenix-Edition/QB64pe.git
  PROBE_BAS: DEV/probe-mouse-drag.bas

jobs:
  # ------------------------------------------------------------------ Linux (control)
  linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.only == 'all' || github.event.inputs.only == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build + headless-GL deps (+ xdotool to post real input)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential x11-utils mesa-common-dev libglu1-mesa-dev libgl1-mesa-dri \
            libasound2-dev libpng-dev pulseaudio dbus-x11 libportaudio2 \
            libcurl4-openssl-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols xvfb xdotool

      - name: Fetch QB64-PE (main)
        run: git clone --depth 1 "$QB64PE_REPO" qb64pe

      - name: Build compiler
        run: |
          mkdir -p "$HOME/.local/share/applications" "$HOME/.local/share/icons"
          cd qb64pe && chmod +x ./setup_lnx.sh
          # Non-blank arg -> setup does NOT auto-launch the IDE (needs a display).
          ./setup_lnx.sh nogui
          test -x ./qb64pe || { echo "::error::qb64pe compiler was not built"; exit 1; }

      - name: Compile the probe
        run: |
          xvfb-run -a ./qb64pe/qb64pe -w -x -o probe-mouse-drag "$PROBE_BAS"
          test -x ./probe-mouse-drag || { echo "::error::probe did not compile"; exit 1; }

      - name: Package binary (tar preserves +x)
        run: tar czf probe-mouse-drag-linux-x64.tar.gz probe-mouse-drag

      - name: Upload executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-exe-linux-x64
          path: probe-mouse-drag-linux-x64.tar.gz
          if-no-files-found: warn

      - name: Run the experiment (Xvfb + real XTEST drags)
        continue-on-error: true
        run: |
          set -x
          export LIBGL_ALWAYS_SOFTWARE=1
          export DISPLAY=:99
          Xvfb :99 -screen 0 1400x1000x24 &
          XVFB_PID=$!
          sleep 3

          ./probe-mouse-drag </dev/null &
          PROBE_PID=$!
          sleep 6

          WID=$(xdotool search --name "mouse-drag probe" | head -1 || true)
          if [ -z "$WID" ]; then
            echo "::warning::probe window never appeared — no measurement possible"
          else
            echo "window id: $WID"
            xdotool windowmove "$WID" 0 0 || true
            xdotool windowactivate "$WID" || true
            sleep 1

            # Same gesture in every mode: press, drag an L-shaped path of ~800px
            # over ~2s, release. XTEST events are real input, not XSendEvent.
            for MODE in 1 2 3 4; do
              xdotool key "$MODE"; sleep 0.5
              xdotool mousemove 200 300; sleep 0.3
              xdotool mousedown 1
              for i in $(seq 0 39); do
                xdotool mousemove $((200 + i * 15)) $((300 + i * 8))
                sleep 0.03
              done
              for i in $(seq 0 19); do
                xdotool mousemove $((800 - i * 15)) $((620 + i * 5))
                sleep 0.03
              done
              xdotool mouseup 1
              sleep 0.8
            done

            xdotool key Escape; sleep 1
          fi

          kill $PROBE_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          sleep 1

          echo "================ SCORES ================"
          grep -E 'DRAG-END|switched|reset' probe-mouse-drag.log || echo "(no scored drags)"
          echo "================ HEAD OF FULL LOG ================"
          head -60 probe-mouse-drag.log || true
          echo "================ line count ================"
          wc -l probe-mouse-drag.log || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log-linux
          path: probe-mouse-drag.log
          if-no-files-found: warn

  # ------------------------------------------------------------------ macOS (Apple Silicon)
  macos:
    if: ${{ github.event_name == 'push' || github.event.inputs.only == 'all' || github.event.inputs.only == 'macos' }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch QB64-PE (main)
        run: git clone --depth 1 "$QB64PE_REPO" qb64pe

      - name: Build compiler
        run: |
          cd qb64pe && chmod +x ./setup_osx.command
          # Non-blank arg -> setup does NOT auto-launch the IDE, which on a Mac
          # runner would OPEN and HANG the step.
          ./setup_osx.command nogui
          test -x ./qb64pe || { echo "::error::qb64pe compiler was not built"; exit 1; }

      - name: Compile the probe
        run: |
          ./qb64pe/qb64pe -w -x -o probe-mouse-drag "$PROBE_BAS"
          test -x ./probe-mouse-drag || { echo "::error::probe did not compile"; exit 1; }

      - name: Package binary (tar preserves +x)
        run: tar czf probe-mouse-drag-macos-arm64.tar.gz probe-mouse-drag

      - name: Upload executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-exe-macos-arm64
          path: probe-mouse-drag-macos-arm64.tar.gz
          if-no-files-found: warn

      - name: Attempt a headless run (does a GLFW window open at all?)
        continue-on-error: true
        run: |
          # NOTE: no `timeout` on macOS runners — that is GNU coreutils, and its
          # absence silently skipped this step entirely on the first run. Use a
          # background PID + sleep + kill, which is portable, and keep </dev/null
          # so a "press enter" prompt can never block and burn Mac minutes.
          ./probe-mouse-drag </dev/null >probe-stdout.txt 2>&1 &
          PROBE_PID=$!
          sleep 30
          if kill -0 $PROBE_PID 2>/dev/null; then
            echo "probe was still RUNNING after 30s (a window likely opened)"
            kill $PROBE_PID 2>/dev/null || true
          else
            echo "probe EXITED on its own before 30s (window init likely failed)"
          fi
          wait $PROBE_PID 2>/dev/null || true
          echo "================ probe stdout/stderr ================"
          cat probe-stdout.txt 2>/dev/null || echo "(nothing captured)"
          echo "================ probe log ================"
          if [ -f probe-mouse-drag.log ]; then
            cat probe-mouse-drag.log
          else
            echo "(no log file — the probe never reached its main loop)"
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-log-macos
          path: |
            probe-mouse-drag.log
            probe-stdout.txt
          if-no-files-found: ignore
