# Build the tap-to-click probe as a Windows .exe, so it can be run on a laptop
# TOUCHPAD without installing a QB64-PE toolchain.
#
# WHY: INPUT/MOUSE.BM keeps an in-drain _MOUSEBUTTON capture behind $IF MAC. A
# tap whose press AND release are both consumed by one _MOUSEINPUT drain is
# invisible to the read taken after the loop, so without the capture the click
# is dropped. Measured 2026-09-11 with DEV/probe-tap-click.bas:
#
#   macOS trackpad tap .... 21 rescues / 22 taps   -> capture essential
#   macOS mouse button .....  0 rescues / 11 clicks -> irrelevant
#   Linux mouse button .....  0 rescues / 27 clicks -> irrelevant
#
# The dividing line is gesture duration, not OS: physical buttons stay down
# longer than a frame, trackpad taps do not. So the open question is a
# Windows/Linux laptop TOUCHPAD with tap-to-click — the same sub-frame gesture.
# Rescues there mean the $IF MAC fork should go and the capture become
# unconditional, fixing silent lost taps for every laptop user.
#
# There is no headless run here on purpose: the whole measurement needs a human
# finger tapping a real touchpad. CI only produces the binary.
#
# TEMPORARY — delete once that question is answered.
name: Tap-Click Probe (Windows build)

on:
  workflow_dispatch:
  push:
    branches: [claude/brave-bohr-dy3op1]
    paths:
      - 'DEV/probe-tap-click.bas'
      - '.github/workflows/probe-tap-click-windows.yml'

env:
  QB64PE_REPO: https://github.com/QB64-Phoenix-Edition/QB64pe.git
  PROBE_BAS: DEV/probe-tap-click.bas

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Fetch QB64-PE (main)
        shell: bash
        run: git clone --depth 1 "$QB64PE_REPO" qb64pe

      # Carried over from hw-cursor-crossplatform.yml: upstream's
      # qoa_ma_vtable.cpp uses raw malloc/free with no #include <cstdlib>, which
      # breaks the Windows C++ compile on MinGW. Harmless if already fixed.
      - name: Patch upstream qoa_ma_vtable.cpp (add missing <cstdlib>)
        shell: bash
        run: |
          F=qb64pe/internal/c/parts/audio/extras/qoa_ma_vtable.cpp
          if [ -f "$F" ] && ! grep -q '<cstdlib>' "$F"; then
            { echo '#include <cstdlib>'; cat "$F"; } > "$F.tmp" && mv "$F.tmp" "$F"
            echo "patched: prepended #include <cstdlib>"
          else
            echo "no patch needed"
          fi

      - name: Build compiler (bundled MinGW)
        run: |
          cd qb64pe
          call setup_win.cmd

      - name: Compile the probe
        run: qb64pe\qb64pe.exe -w -x -o probe-tap-click.exe %PROBE_BAS:/=\%

      - name: Upload executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-tap-click-windows-x64
          path: probe-tap-click.exe
          if-no-files-found: warn
